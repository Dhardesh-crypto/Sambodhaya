<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>วัด 3 มิติ · Sambodhaya</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600;700&display=swap">
<style>
/* Layout: the 3D temple fills the screen; calm paper-coloured panels float above it.
   Same tokens as the Sambodhaya site so the two feel like one place. */
:root {
  --ink: #3a2a1d; --paper: #fdf8ee; --cream: #fffdf8; --saffron: #e98a2b; --saffron-deep: #a5560f;
  --leaf: #4f9a5d; --leaf-soft: #e6f3e3; --gold: #f2cc62; --muted: #6e5c4c;
  --display: "Itim", "Mali", "Thonburi", system-ui, sans-serif; --body: "Mali", "Itim", "Thonburi", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #f3d9a6; color: var(--ink); font-family: var(--body); }
#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--saffron-deep); outline-offset: 2px; }
.panel { background: rgba(255, 253, 248, .96); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 3px 3px 0 rgba(58, 42, 29, .5); }
.btn { background: var(--saffron); color: var(--cream); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 16px; font-family: var(--display); font-size: 1.05rem; box-shadow: 2px 2px 0 rgba(58, 42, 29, .55); text-decoration: none; display: inline-block; }
.chip { background: var(--cream); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-size: .92rem; }
.chip.on { background: var(--gold); }
.quiet { color: var(--muted); font-size: .85rem; margin: 0; }

/* top bar */
.hud-top { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; z-index: 5; }
.hud-top > * { pointer-events: auto; }
.brand { font-family: var(--display); font-size: 1.15rem; padding: 6px 12px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.hud-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hud-tools.folded > :not(.pin) { display: none; } /* the menu (☰) holds the rest, out of the way of the temple */
#btn-menu[aria-expanded="true"] { background: var(--gold); }
.proto { position: fixed; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: .75rem; padding: 3px 12px; background: #fff6dc; border: 1.5px dashed #d9b75a; border-radius: 999px; z-index: 4; white-space: nowrap; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; }

/* proximity prompt */
.prompt { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); padding: 8px 14px; display: flex; gap: 10px; align-items: center; z-index: 5; max-width: calc(100% - 24px); }
.prompt strong { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.prompt.away { display: none; } /* out of the way while he is doing something, until he walks on */
/* two players: each child's note on their own side, marked with their colour (the same as the ring at their feet) */
#prompt2 { display: none; }
body.two #prompt2:not([hidden]):not(.away) { display: flex; }
body.two #prompt { left: 26%; border-left: 6px solid #e98a2b; }
body.two #prompt2 { left: 74%; border-left: 6px solid #3d7fd1; }
body.two .prompt { max-width: calc(50% - 16px); }
.two-touch { display: none !important; }
.key { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--cream); font-family: var(--display); }

/* quests: the checklist (tap its title to fold it) and the notes that tick a step or give a hint */
.questbox { position: fixed; left: 10px; top: calc(62px + env(safe-area-inset-top, 0px)); width: min(300px, calc(100% - 20px)); padding: 8px 12px; z-index: 4; font-size: .9rem; }
.questbox > button { all: unset; cursor: pointer; display: block; font-family: var(--display); font-size: 1.05rem; }
.questbox ol { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.questbox li { color: var(--muted); line-height: 1.4; }
.questbox li.next { color: var(--ink); font-weight: 600; }
.questbox li.done { color: var(--leaf); text-decoration: line-through; }
.questbox > button:focus-visible { outline: 3px solid var(--saffron-deep); outline-offset: 2px; }
.questbox.folded ol { display: none; }
.toast { position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(460px, calc(100% - 24px)); padding: 10px 14px; z-index: 6; line-height: 1.5; font-size: .95rem; pointer-events: none; }
@media (max-width: 760px) { .questbox { top: auto; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); } .toast { top: calc(var(--prompt-top, 124px) + 46px); } }
@media (pointer: coarse) { .questbox { left: calc(12px + env(safe-area-inset-left, 0px)); top: auto; bottom: calc(176px + env(safe-area-inset-bottom, 0px)); width: min(236px, calc(100% - 136px)); font-size: .85rem; } } /* above the joystick, clear of the round buttons */

/* the meditation corner: the choice while sitting, and a warm glow at the edges while it lasts */
.medi { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 6px 10px 6px 14px; display: flex; gap: 8px; align-items: center; z-index: 5; white-space: nowrap; }
.medi span { font-family: var(--display); }
#medi-glow { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 3s ease; background: radial-gradient(ellipse at center, rgba(255, 196, 120, 0) 55%, rgba(255, 170, 90, .28) 100%); }
#medi-glow.on { opacity: 1; }
/* folding a lotus: the bud seen from the front; each petal of the row being folded is a button */
.fold { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(340px, calc(100% - 24px)); padding: 8px 12px 10px; z-index: 5; text-align: center; }
.fold svg { width: 100%; max-height: 210px; display: block; margin: 0 auto; }
.fold p { margin: 4px 0 6px; line-height: 1.45; font-size: .92rem; }
.fold .bud { fill: #ec8fab; stroke: #b5577a; stroke-width: 2; }
.fold .petal path { fill: #f2a3b8; stroke: #c06a88; stroke-width: 2; }
.fold .petal line, .fold .petal circle { opacity: 0; }
.fold .petal { transition: transform .5s ease; transform-origin: 0 0; }
.fold .petal.live { cursor: pointer; }
.fold .petal.live path { fill: #f7b3c6; stroke: var(--saffron-deep); stroke-width: 3; }
.fold .petal.live:hover path, .fold .petal.live:focus-visible path { fill: #fcc8d6; }
.fold .petal:focus { outline: none; }
.fold .petal.folded { transform: rotate(var(--open)) scale(.5, .78); }
.fold .petal.folded path { fill: #fde3ea; stroke: #c06a88; stroke-width: 4; }
.fold .petal.folded line { opacity: 1; stroke: #d58aa3; stroke-width: 4; }
.fold .petal.folded circle { opacity: 1; fill: #f2a3b8; stroke: #c06a88; stroke-width: 3; }
@media (pointer: coarse) { .fold { bottom: auto; top: calc(var(--prompt-top, 124px) + 8px); } .fold svg { max-height: 170px; } }
@media (pointer: coarse) { .medi { bottom: auto; top: calc(var(--prompt-top, 124px) + 46px); } }

/* the monks' blessing: the verse and its meaning while it is recited */
.subtitle { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(720px, calc(100% - 32px)); padding: 10px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; z-index: 5; pointer-events: none; background: rgba(58, 42, 29, .78); color: var(--cream); border-radius: 14px; line-height: 1.5; }
.subtitle .pali { font-family: var(--display); font-size: 1.1rem; color: var(--gold); }
@media (pointer: coarse) { .subtitle { bottom: calc(190px + env(safe-area-inset-bottom, 0px)); font-size: .9rem; } }

/* dialogs */
.dialog { position: fixed; z-index: 10; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.dialog h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.6rem; color: var(--saffron-deep); }
.dialog p { margin: 0; line-height: 1.6; }
/* photo mode: everything steps aside but a small bar */
body.photo .hud-top, body.photo .prompt, body.photo .questbox, body.photo .toast, body.photo .medi, body.photo .fold, body.photo .subtitle, body.photo .proto, body.photo .tbtns, body.photo .pbtns, body.photo #medi-glow { display: none !important; }
.photobar { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 6px 8px; z-index: 6; white-space: nowrap; }
@media (pointer: coarse) { .photobar { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); } }
#photo-flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; transition: opacity .5s ease; }
#photo-flash.on { opacity: .85; transition: none; }
.dialog .photo-img { width: 100%; height: auto; border-radius: 10px; border: 3px solid var(--gold); display: block; }
.dialog .mural { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 10px; border: 3px solid var(--gold); display: block; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.places { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.places button { width: 100%; text-align: left; background: var(--cream); border: 1.5px solid var(--ink); border-radius: 12px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
.places .ic { font-size: 1.4rem; }
.passport h3 { margin: 12px 0 6px; font-family: var(--display); font-weight: 400; font-size: 1.15rem; color: var(--saffron-deep); }
.stamps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px 6px; }
.stamps li { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: .8rem; line-height: 1.25; color: var(--muted); }
.stamps .seal { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 1.7rem; border: 2px dashed rgba(110, 92, 76, .45); filter: grayscale(1); opacity: .38; }
.stamps li.got { color: var(--ink); }
.stamps li.got .seal { border: 3px double #b8322a; background: #fdeee6; filter: none; opacity: 1; transform: rotate(-8deg); box-shadow: 0 0 0 2px #fdeee6, 0 0 0 3.5px rgba(184, 50, 42, .55); }
.stamps li.got:nth-child(2n) .seal { transform: rotate(6deg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); }
.sw.on { box-shadow: 0 0 0 3px var(--gold); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-family: var(--display); }
.preview { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); background: var(--leaf-soft); }
.note { background: var(--leaf-soft); border-radius: 12px; padding: 8px 12px; font-size: .9rem; }
.warn { background: #fdecec; border-radius: 12px; padding: 8px 12px; font-size: .9rem; }

/* loading */
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); z-index: 20; font-family: var(--display); font-size: 1.4rem; text-align: center; padding: 20px; }

/* touch controls */
.touch { display: none; }
@media (pointer: coarse) {
  .touch { display: block; }
  .stick { position: fixed; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 253, 248, .55); border: 2px solid rgba(58, 42, 29, .6); z-index: 6; touch-action: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: var(--cream); border: 2px solid var(--ink); }
  .tbtns { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 6; }
  .tbtns button { width: 64px; height: 64px; border-radius: 50%; background: rgba(255, 253, 248, .85); border: 2px solid var(--ink); font-family: var(--display); font-size: 1rem; }
  /* phones and tablets: one slim line just under the top buttons, clear of the boy in the middle of the screen
     (the round E button does the key's job; the subtitle is left out) */
  .prompt { top: var(--prompt-top, 124px); bottom: auto; padding: 5px 6px 5px 12px; gap: 8px; }
  .prompt .key, .prompt br, #prompt-sub { display: none; }
  .prompt strong { font-size: 1rem; white-space: nowrap; }
  .prompt .btn { padding: 3px 12px; font-size: .95rem; white-space: nowrap; }
  /* two players on a touch screen: a stick in each bottom corner, each with its own small buttons above it */
  body.two .two-touch { display: block !important; }
  body.two .tbtns { display: none; }
  #stick2 { left: auto; right: calc(18px + env(safe-area-inset-right, 0px)); border-color: #3d7fd1; }
  body.two #stick { border-color: #e98a2b; }
  .pbtns { position: fixed; bottom: calc(172px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; z-index: 6; }
  body.two .questbox { bottom: calc(226px + env(safe-area-inset-bottom, 0px)); }
  .pbtns.p1 { left: calc(12px + env(safe-area-inset-left, 0px)); }
  .pbtns.p2 { right: calc(12px + env(safe-area-inset-right, 0px)); }
  .pbtns button { width: min(42px, calc((50vw - 28px) / 4)); height: min(42px, calc((50vw - 28px) / 4)); border-radius: 50%; background: rgba(255, 253, 248, .85); border: 2px solid #e98a2b; font-family: var(--display); font-size: .95rem; }
  .pbtns.p2 button { border-color: #3d7fd1; }
  body.two .prompt { top: var(--prompt-top, 124px); }
  body.two #prompt { left: 25%; } body.two #prompt2 { left: 75%; }
}
@media (max-width: 600px) { .places { grid-template-columns: minmax(0, 1fr); } .hud-tools .label { display: none; } }
</style>

<body>
<canvas id="view" tabindex="0" aria-label="วัดสัมโพธายะแบบ 3 มิติ ใช้ปุ่มลูกศรหรือ W A S D เพื่อเดิน"></canvas>
<div class="loading" id="loading">กำลังเตรียมวัด…</div>

<div class="hud-top">
  <a class="brand panel" href="index.html">☸ วัดสัมโพธายะ</a>
  <div class="hud-tools folded" id="hud-tools">
    <button class="chip pin" id="btn-places">🗺️ <span class="label" data-th="ที่ต่าง ๆ ในวัด" data-en="Places">ที่ต่าง ๆ ในวัด</span></button>
    <button class="chip pin" id="btn-quest">📜 <span class="label" data-th="ภารกิจ" data-en="Quests">ภารกิจ</span></button>
    <button class="chip pin" id="btn-passport">📖 <span class="label" data-th="สมุดตรา" data-en="Passport">สมุดตรา</span></button>
    <button class="chip" id="btn-two" aria-pressed="false">👫 <span class="label" data-th="เล่นสองคน" data-en="Two players">เล่นสองคน</span></button>
    <button class="chip" id="btn-photo">📷 <span class="label" data-th="ถ่ายภาพ" data-en="Photo">ถ่ายภาพ</span></button>
    <button class="chip" id="btn-avatar">🧍 <span class="label" data-th="ตัวละครของฉัน" data-en="My avatar">ตัวละครของฉัน</span></button>
    <button class="chip" id="btn-quality">✨ <span class="label">ภาพ: ละเอียด</span></button>
    <button class="chip" id="btn-wai">🙏 <span class="label" data-th="ไหว้" data-en="Wai">ไหว้</span></button>
    <button class="chip" id="btn-sit">🧘 <span class="label" data-th="นั่ง" data-en="Sit">นั่ง</span></button>
    <button class="chip" id="btn-kraap">🙇 <span class="label" data-th="กราบพระ" data-en="Tribute">กราบพระ</span></button>
    <button class="chip" id="btn-pet">🐾 <span class="label" data-th="ลูบหัวหมา" data-en="Pet the dog">ลูบหัวหมา</span></button>
    <button class="chip" id="btn-sound" aria-pressed="false">🔈 <span class="label" data-th="เสียง" data-en="Sound">เสียง</span></button>
    <button class="chip" id="btn-night" aria-pressed="false">🌙 <span class="label" data-th="กลางคืน" data-en="Night">กลางคืน</span></button>
    <button class="chip" id="btn-calm" aria-pressed="false">🍃 <span class="label" data-th="ลดการเคลื่อนไหว" data-en="Calm motion">ลดการเคลื่อนไหว</span></button>
    <a class="chip" href="index.html?from=3d#feedback" style="text-decoration:none">💬 <span class="label" data-th="แจ้งปัญหา" data-en="Feedback">แจ้งปัญหา</span></a>
    <button class="chip" id="btn-help">❔</button>
    <a class="chip" href="index.html#exit" style="text-decoration:none">🚪 <span class="label" data-th="ออกจากวัด" data-en="Leave">ออกจากวัด</span></a>
    <button class="chip pin" id="btn-menu" aria-expanded="false" aria-controls="hud-tools">☰ <span class="label" data-th="เมนู" data-en="Menu">เมนู</span></button>
  </div>
</div>

<div class="prompt panel" id="prompt" hidden>
  <span class="key" aria-hidden="true">E</span>
  <span><strong id="prompt-name"></strong><br><span class="quiet" id="prompt-sub"></span></span>
  <button class="btn" id="prompt-go">เข้า</button>
</div>
<div class="prompt panel p2" id="prompt2" hidden>
  <span class="key" aria-hidden="true">↵</span>
  <span><strong id="prompt2-name"></strong><br><span class="quiet" id="prompt2-sub"></span></span>
  <button class="btn" id="prompt2-go">เข้า</button>
</div>

<div class="questbox panel" id="questbox" hidden><button id="quest-head" aria-label="ภารกิจ"></button><ol id="quest-steps"></ol></div>
<div id="medi-glow" aria-hidden="true"></div>
<div class="medi panel" id="medi" hidden></div>
<div class="fold panel" id="fold" hidden></div>
<div class="toast panel" id="toast" role="status" aria-live="polite" hidden></div>
<div class="photobar panel" id="photobar" hidden>
  <button class="chip" id="photo-in" aria-label="ซูมเข้า">＋</button><button class="chip" id="photo-out" aria-label="ซูมออก">－</button>
  <button class="btn" id="photo-shot">📸 <span data-th="ถ่าย" data-en="Take photo">ถ่าย</span></button>
  <button class="chip" id="photo-done">✕ <span data-th="เสร็จ" data-en="Done">เสร็จ</span></button>
</div>
<div id="photo-flash" aria-hidden="true"></div>
<div class="subtitle" id="subtitle" role="status" aria-live="polite" hidden></div>

<div class="dialog panel" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
  <h2 id="dlg-title"></h2>
  <div id="dlg-body"></div>
</div>

<div class="touch two-touch" aria-hidden="true">
  <div class="stick" id="stick2"><div class="knob" id="knob2"></div></div>
  <div class="pbtns p1"><button data-kid="1" data-do="act">E</button><button data-kid="1" data-do="wai">🙏</button><button data-kid="1" data-do="sit">🧘</button><button data-kid="1" data-do="jump">⤴︎</button></div>
  <div class="pbtns p2"><button data-kid="2" data-do="act">E</button><button data-kid="2" data-do="wai">🙏</button><button data-kid="2" data-do="sit">🧘</button><button data-kid="2" data-do="jump">⤴︎</button></div>
</div>
<div class="touch" aria-hidden="true">
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="tbtns"><button id="t-sit" aria-label="นั่ง">🧘</button><button id="t-wai" aria-label="ไหว้">🙏</button><button id="t-pet" aria-label="ลูบหัวหมา">🐾</button><button id="t-jump">⤴︎</button><button id="t-act">E</button></div>
</div>

<p class="proto" role="note">🕯️ ต้นแบบ · เล่นคนเดียว ไม่มีอะไรถูกส่งออกจากเครื่องนี้ · ยังไม่ได้ทดสอบกับเด็กจริง</p>
<script type="module" src="src/world.js"></script>
